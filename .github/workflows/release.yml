name: Verify release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose complete installation package will be verified"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Upload the complete xmake output from the release machine to the draft.
      # Native-only CI builds never replace this package or accepted notes.
      - name: Download installation package and checksum
        run: |
          gh release download "$RELEASE_TAG" --pattern 'LHolo-client-windows-x64.zip' --pattern 'LHolo-client-windows-x64.zip.sha256' --dir release

      - name: Verify version, resource pack, UI protocol and installation inventory
        run: python tools/oreui/release_package.py --verify release/LHolo-client-windows-x64.zip --tag "$RELEASE_TAG"
