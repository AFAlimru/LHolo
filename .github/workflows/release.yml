name: Verify release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose complete installation package will be verified"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Upload the complete xmake output from the release machine to the draft.
      # Verification never rebuilds the package or overwrites accepted notes.
      - name: Download installation package and GitHub asset digest
        run: |
          gh release download "$RELEASE_TAG" --pattern 'LHolo-client-windows-x64.zip' --dir release
          gh release view "$RELEASE_TAG" --json assets > release/asset-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          archive = Path("release/LHolo-client-windows-x64.zip")
          assets = json.loads(Path("release/asset-metadata.json").read_text())["assets"]
          digest = next(asset["digest"] for asset in assets if asset["name"] == archive.name)
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise ValueError("Missing GitHub asset SHA256")
          archive.with_name(archive.name + ".sha256").write_text(
              f"{digest[7:]}  {archive.name}\n", encoding="ascii")
          PY

      - name: Verify version, resource pack, UI protocol and installation inventory
        run: python tools/oreui/release_package.py --verify release/LHolo-client-windows-x64.zip --tag "$RELEASE_TAG"
